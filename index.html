<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brown Log Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#E9EEEB; --surface:#FFFFFF; --ink:#1F2A27; --muted:#5D6B66; --line:#CFD8D4;
  --accent:#1E6B5C; --accent-ink:#FFFFFF; --warn:#B9791A; --alert:#B3362E;
  --pic-bg:#E4DCCB; --s1:#8A6A3B; --s2:#1E6B5C; --s3:#4E8A5C; --s4:#B9791A; --s5:#C9632A; --s6:#B3362E; --s7:#8E2430;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151B19; --surface:#1E2623; --ink:#E6ECE9; --muted:#9AA8A2; --line:#33403B;
  --accent:#4FB39C; --accent-ink:#0E1513; --pic-bg:#3A352C;
}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 17px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.9rem;line-height:1.1;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:0 0 10px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* Login */
.login{min-height:calc(100vh - 40px);display:grid;place-items:center}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px}
.login h1{margin-bottom:4px}
label{display:block;font-weight:700;margin:14px 0 6px}
input[type=email],input[type=password],input[type=datetime-local],textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:76px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:13px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%;margin-top:20px}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);padding:8px 14px}
.btn:disabled{opacity:.55;cursor:wait}
.error{color:var(--alert);margin:12px 0 0;min-height:1.5em}

/* Main */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
header p{margin:4px 0 0;font-size:.95rem}
.log-btn{width:100%;padding:22px;font-size:1.3rem;border-radius:18px}
.log-btn svg{width:30px;height:30px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:28px 0 12px;padding-bottom:4px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.watch{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}

.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.entry strong{display:block}
.entry .meta{font-size:.88rem;color:var(--muted)}
.tag{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:6px;margin:4px 4px 0 0;background:var(--bg);border:1px solid var(--line)}
.tag.vet{background:var(--alert);color:#fff;border-color:var(--alert)}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.85rem;padding:4px}
.empty{padding:28px 0;color:var(--muted)}

/* Log sheet */
dialog{border:0;padding:0;width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;
  margin:auto auto 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(15,22,20,.55)}
dialog form{padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){dialog{border-radius:20px;margin:auto}}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.close{background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-weight:700;margin-bottom:8px;padding:0}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice label{margin:0;font-weight:400;border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;background:var(--bg)}
.choice input:checked + label{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.choice input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}

/* Stool picture chart — the one bold element */
.scale{display:grid;gap:8px}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label{margin:0;display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;padding:8px 12px 8px 8px;
  border-radius:14px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-weight:400}
.pic{width:112px;height:68px;border-radius:10px;background:var(--pic-bg);display:block;overflow:hidden}
.pic svg,.pic img{width:100%;height:100%;display:block;object-fit:cover}
.scale .name{display:block;font-weight:700}
.scale .desc{display:block;font-size:.9rem;color:var(--muted);line-height:1.35}
.scale .type{font-size:.8rem;color:var(--muted)}
.ideal{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:1px}
.scale input:checked + label{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));box-shadow:inset 6px 0 0 var(--c)}
.scale input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}
.score-desc{margin:10px 0 0;min-height:1.5em;font-size:.95rem}
.thumb{width:64px;height:48px;border-radius:10px;border:3px solid var(--c);background:var(--pic-bg);overflow:hidden}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}

.swatch{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.2)}
.vet-hint{margin-top:16px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--alert) 12%,var(--surface));border-left:4px solid var(--alert);font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<main id="loginView" class="wrap login hidden">
  <form id="loginForm" novalidate>
    <h1>Brown Log Log</h1>
    <p class="muted" style="margin:0">Sign in, you pooper!</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn wide" id="loginBtn" type="submit">Sign in</button>
    <p class="error" id="loginError" role="alert"></p>
  </form>
</main>

<!-- ============ MAIN ============ -->
<main id="appView" class="wrap hidden">
  <header>
    <div>
      <h1>Brown Log Log</h1>
      <p class="muted" id="whoami"></p>
    </div>
    <button class="btn ghost" id="signOutBtn" type="button">Sign out</button>
  </header>

  <button class="btn log-btn" id="openLog" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Log poop
  </button>

  <div class="filters" id="filters" role="group" aria-label="Show entries for"></div>
  <ul class="entries" id="entries"></ul>
</main>

<!-- ============ LOG SHEET ============ -->
<dialog id="logSheet" aria-labelledby="sheetTitle">
  <form id="logForm" method="dialog" novalidate>
    <div class="sheet-head">
      <h2 id="sheetTitle" style="margin:0">Log poop</h2>
      <button class="close" type="button" id="closeLog" aria-label="Close">×</button>
    </div>

    <fieldset>
      <legend>Which Human?</legend>
      <div class="choice" id="catChoices"></div>
    </fieldset>

    <fieldset>
      <legend>Which picture looks closest?</legend>
      <div class="scale" id="scale"></div>
      <p class="score-desc muted" id="scoreDesc" aria-live="polite">Pick the closest match.</p>
    </fieldset>

    <fieldset>
      <legend>Colour</legend>
      <div class="choice" id="colourChoices"></div>
    </fieldset>

    <fieldset>
      <legend>Anything unusual? <span class="muted" style="font-weight:400">(tick all that apply)</span></legend>
      <div class="choice" id="flagChoices"></div>
    </fieldset>

    <label for="seenAt">When was it seen?</label>
    <input id="seenAt" type="datetime-local" required>

    <label for="notes">Notes <span class="muted" style="font-weight:400">(optional)</span></label>
    <textarea id="notes" placeholder="e.g. ate less this morning, vomited once"></textarea>

    <div class="vet-hint hidden" id="vetHint" role="status"></div>

    <button class="btn wide" id="saveBtn" type="submit">Save log</button>
    <p class="error" id="logError" role="alert"></p>
  </form>
</dialog>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="poo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A6633"/><stop offset="1" stop-color="#5A381A"/></linearGradient>
  <linearGradient id="pooWet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9773F" stop-opacity=".85"/><stop offset="1" stop-color="#6B4520" stop-opacity=".9"/></linearGradient>
</defs></svg>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= SETUP — edit these ================= */
const CONFIG = {
  SUPABASE_URL: 'https://plbqkhpawzchkfjowjzd.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_0phs4xPn21cZB-BohmfioA_hbYCTI_K'   // Settings → API → anon public key (never the service_role key)
};
/* ---------------- NAME YOUR CATS HERE ----------------
   - Replace the names in quotes with your cats' names.
   - watch: true  → cat has a health issue (shows an amber dot)
     watch: false → healthy cat
   - Add a cat: copy one line and change the name.
   - Remove a cat: delete its line.
   - Keep the comma at the end of every line except the last.
   Note: renaming a cat later won't update its old entries,
   so pick names you'll stick with.
   ----------------------------------------------------- */
const CATS = [
  { name: 'Nisha', watch: true  },
  { name: 'Anush', watch: true  }
];
/* ====================================================== */

/* ---------------- STOOL PICTURES (optional) ----------------
   Each type uses a built-in drawing. To use your own photo or image
   instead, put the file next to index.html (e.g. in an "images" folder)
   and write its path between the quotes, e.g. 1: 'images/type1.jpg'.
   Leave it as '' to keep the drawing.
   ------------------------------------------------------------ */
const STOOL_PICTURES = { 1:'', 2:'', 3:'', 4:'', 5:'', 6:'', 7:'' };

const SH = '<ellipse cx="60" cy="63" rx="50" ry="5" fill="#000" opacity=".12"/>';
const HL = (d) => `<path d="${d}" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round"/>`;
const SCORES = {
  1: { name:'Hard pellets', desc:'Separate hard, dry lumps', c:'var(--s1)',
       art: SH+'<g fill="url(#poo)"><circle cx="22" cy="52" r="9"/><circle cx="43" cy="49" r="8"/><circle cx="61" cy="55" r="7"/><circle cx="78" cy="48" r="9"/><circle cx="98" cy="54" r="8"/></g>'
            +HL('M17 47q3-3 7-3')+HL('M73 43q3-3 7-3')+HL('M93 49q3-2 6-2') },
  2: { name:'Firm, segmented log', desc:'Log shape with cracks, firm but not hard', c:'var(--s2)', ideal:true,
       art: SH+'<g fill="url(#poo)"><ellipse cx="22" cy="48" rx="13" ry="11"/><ellipse cx="41" cy="46" rx="12" ry="12"/><ellipse cx="60" cy="47" rx="12" ry="11"/><ellipse cx="79" cy="45" rx="12" ry="12"/><ellipse cx="98" cy="48" rx="13" ry="11"/></g>'
            +'<g stroke="#3E2610" stroke-width="2" stroke-linecap="round" opacity=".55"><path d="M31 38l-2 8M50 37l1 9M69 37l-1 8M88 37l2 8"/></g>'+HL('M16 41q10-6 22-4') },
  3: { name:'Smooth, moist log', desc:'Holds its shape, leaves a little residue', c:'var(--s3)',
       art: SH+'<path fill="url(#poo)" d="M12 50C12 38 30 35 60 37S108 39 108 50 92 62 60 60 12 62 12 50Z"/>'+HL('M22 42q30-6 64-2') },
  4: { name:'Soft log, loses shape', desc:'Very moist, flattens or breaks when picked up', c:'var(--s4)',
       art: SH+'<path fill="url(#poo)" d="M6 59C10 48 26 45 42 47S62 42 76 45 106 46 114 59C102 65 18 65 6 59Z"/>'+HL('M20 52q20-6 40-4') },
  5: { name:'Soft piles', desc:'Soft mounds with some shape', c:'var(--s5)',
       art: SH+'<g fill="url(#poo)"><path d="M10 61C10 42 48 40 50 61Z"/><path d="M48 62C49 49 76 48 78 62Z"/><path d="M76 61C78 41 112 43 112 61Z"/></g>'+HL('M18 52q8-6 18-5')+HL('M85 51q8-5 17-4') },
  6: { name:'Mushy, no shape', desc:'Fluffy, ragged pieces, some texture', c:'var(--s6)',
       art: SH+'<path fill="url(#poo)" d="M8 60C11 51 19 55 25 47S38 50 46 44 58 48 66 42 80 48 88 44 101 52 111 56C113 63 14 65 8 60Z"/>'
            +'<g fill="url(#poo)"><circle cx="16" cy="44" r="3"/><circle cx="104" cy="45" r="3.5"/><circle cx="56" cy="36" r="2.5"/></g>' },
  7: { name:'Watery', desc:'Liquid, no solid pieces', c:'var(--s7)',
       art: '<path fill="url(#pooWet)" d="M5 60C9 52 29 55 43 51S69 54 85 50 115 54 115 60C111 67 11 68 5 60Z"/>'
            +'<g fill="url(#pooWet)"><ellipse cx="20" cy="45" rx="3" ry="2"/><ellipse cx="100" cy="44" rx="3.5" ry="2"/><ellipse cx="60" cy="40" rx="2" ry="1.5"/></g>'+HL('M30 57q15-3 30-2') }
};
function stoolPic(n){
  const src = STOOL_PICTURES[n];
  return src ? `<img src="${esc(src)}" alt="" loading="lazy">`
             : `<svg viewBox="4 30 112 40" aria-hidden="true">${SCORES[n].art}</svg>`;
}
const COLOURS = [
  { v: 'Brown',            hex: '#6B4426' },
  { v: 'Dark / black',     hex: '#1A1A1A', concern: true },
  { v: 'Red-tinged',       hex: '#9E2B25', concern: true },
  { v: 'Yellow / orange',  hex: '#C98A1E' },
  { v: 'Green',            hex: '#5E7A2E' },
  { v: 'Pale / grey',      hex: '#B9B6AE', concern: true }
];
const FLAGS = [
  { v: 'Blood',              concern: true },
  { v: 'Mucus' },
  { v: 'Worms / foreign bits', concern: true },
  { v: 'Straining' },
  { v: 'Outside litter box' },
  { v: 'Very strong smell' }
];

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let currentUser = null, filterCat = 'All';

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function localNow(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function fmtTime(iso){ return new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }
function needsVet(score, colour, flags){
  const reasons=[];
  if (score>=6) reasons.push('very loose stool');
  if (score===1) reasons.push('hard, dry stool');
  const col = COLOURS.find(c=>c.v===colour); if (col?.concern) reasons.push(colour.toLowerCase()+' colour');
  (flags||[]).forEach(f=>{ if (FLAGS.find(x=>x.v===f)?.concern) reasons.push(f.toLowerCase()); });
  return reasons;
}

/* ---------- auth ---------- */
async function showView(session){
  currentUser = session?.user || null;
  $('loginView').classList.toggle('hidden', !!currentUser);
  $('appView').classList.toggle('hidden', !currentUser);
  if (currentUser){ $('whoami').textContent = 'Signed in as ' + currentUser.email; renderFilters(); loadEntries(); }
}
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const email=$('email').value.trim(), password=$('password').value;
  if (!email || !password){ $('loginError').textContent='Enter your email and password.'; return; }
  $('loginBtn').disabled=true; $('loginError').textContent='';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('loginBtn').disabled=false;
  if (error) $('loginError').textContent = error.message.includes('Invalid') ? 'Email or password is wrong. Check with the admin if you need an account.' : error.message;
});
$('signOutBtn').addEventListener('click', ()=>sb.auth.signOut());
sb.auth.onAuthStateChange((_evt, session)=>showView(session));
sb.auth.getSession().then(({data})=>showView(data.session));

/* ---------- build log form ---------- */
$('catChoices').innerHTML = CATS.map(c=>`
  <input type="radio" name="cat" id="cat-${slug(c.name)}" value="${esc(c.name)}" required>
  <label for="cat-${slug(c.name)}">${esc(c.name)}${c.watch?'<span class="watch" title="On health watch"></span>':''}</label>`).join('');

$('scale').innerHTML = Object.entries(SCORES).map(([n,s])=>`
  <input type="radio" name="score" id="score-${n}" value="${n}">
  <label for="score-${n}" style="--c:${s.c}">
    <span class="pic">${stoolPic(n)}</span>
    <span>
      <span class="name">${esc(s.name)}${s.ideal?'<span class="ideal">Healthy</span>':''}</span>
      <span class="desc">${esc(s.desc)}</span>
      <span class="type">Type ${n}</span>
    </span>
  </label>`).join('');

$('colourChoices').innerHTML = COLOURS.map(c=>`
  <input type="radio" name="colour" id="col-${slug(c.v)}" value="${esc(c.v)}">
  <label for="col-${slug(c.v)}"><span class="swatch" style="background:${c.hex}"></span>${esc(c.v)}</label>`).join('');

$('flagChoices').innerHTML = FLAGS.map(f=>`
  <input type="checkbox" name="flags" id="flag-${slug(f.v)}" value="${esc(f.v)}">
  <label for="flag-${slug(f.v)}">${esc(f.v)}</label>`).join('');

function readForm(){
  const f=$('logForm');
  return {
    cat: f.cat.value,
    score: Number(f.score.value) || null,
    colour: f.colour.value || null,
    flags: [...f.querySelectorAll('input[name=flags]:checked')].map(i=>i.value),
    seen: $('seenAt').value,
    notes: $('notes').value.trim() || null
  };
}
$('logForm').addEventListener('change', ()=>{
  const d=readForm();
  if (d.score){ $('scoreDesc').textContent='Selected: '+SCORES[d.score].name; }
  const reasons = d.score ? needsVet(d.score, d.colour, d.flags) : [];
  $('vetHint').classList.toggle('hidden', !reasons.length);
  if (reasons.length) $('vetHint').innerHTML = `<b>Worth flagging to the vet:</b> ${esc(reasons.join(', '))}. Mention it in the notes and tell whoever is in charge of the cats today.`;
});

$('openLog').addEventListener('click', ()=>{
  $('logForm').reset(); $('seenAt').value=localNow(); $('logError').textContent='';
  $('scoreDesc').textContent='Pick the closest match.'; $('vetHint').classList.add('hidden');
  if (filterCat!=='All'){ const r=document.getElementById('cat-'+slug(filterCat)); if (r) r.checked=true; }
  $('logSheet').showModal();
});
$('closeLog').addEventListener('click', ()=>$('logSheet').close());

$('logForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const d=readForm();
  if (!d.cat)   return $('logError').textContent='Choose which cat.';
  if (!d.score) return $('logError').textContent='Choose the picture that looks closest.';
  if (!d.seen)  return $('logError').textContent='Enter when it was seen.';
  $('saveBtn').disabled=true; $('logError').textContent='';
  const { error } = await sb.from('poop_logs').insert({
    cat:d.cat, score:d.score, colour:d.colour, flags:d.flags, notes:d.notes,
    logged_at:new Date(d.seen).toISOString(),
    logged_by:currentUser.id, logged_by_email:currentUser.email
  });
  $('saveBtn').disabled=false;
  if (error){ $('logError').textContent='Could not save: '+error.message; return; }
  $('logSheet').close(); toast('Log saved'); loadEntries();
});

/* ---------- list ---------- */
function renderFilters(){
  const names=['All',...CATS.map(c=>c.name)];
  $('filters').innerHTML = names.map(n=>{
    const cat=CATS.find(c=>c.name===n);
    return `<button class="chip" type="button" data-cat="${esc(n)}" aria-pressed="${n===filterCat}">${esc(n)}${cat?.watch?'<span class="watch"></span>':''}</button>`;
  }).join('');
}
$('filters').addEventListener('click', e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  filterCat=b.dataset.cat; renderFilters(); loadEntries();
});

async function loadEntries(){
  let q = sb.from('poop_logs').select('*').order('logged_at',{ascending:false}).limit(40);
  if (filterCat!=='All') q=q.eq('cat',filterCat);
  const { data, error } = await q;
  const ul=$('entries');
  if (error){ ul.innerHTML=`<li class="empty">Could not load entries: ${esc(error.message)}</li>`; return; }
  if (!data.length){ ul.innerHTML=`<li class="empty">No entries yet${filterCat!=='All'?' for '+esc(filterCat):''}. Tap “Log poop” after the next litter check.</li>`; return; }
  ul.innerHTML = data.map(r=>{
    const s=SCORES[r.score]; const reasons=needsVet(r.score,r.colour,r.flags);
    const mine = r.logged_by===currentUser.id;
    return `<li class="entry">
      <div class="thumb" style="--c:${s.c}" role="img" aria-label="${esc(s.name)}">${stoolPic(r.score)}</div>
      <div>
        <strong>${esc(r.cat)} — ${esc(s.name)}</strong>
        <div class="meta">${fmtTime(r.logged_at)}${r.logged_by_email?' by '+esc(r.logged_by_email.split('@')[0]):''}</div>
        ${r.colour?`<span class="tag">${esc(r.colour)}</span>`:''}
        ${(r.flags||[]).map(f=>`<span class="tag">${esc(f)}</span>`).join('')}
        ${reasons.length?'<span class="tag vet">Flag to vet</span>':''}
        ${r.notes?`<div class="meta" style="margin-top:4px">${esc(r.notes)}</div>`:''}
      </div>
      ${mine?`<button class="del" type="button" data-id="${r.id}" aria-label="Delete this entry">Delete</button>`:'<span></span>'}
    </li>`;
  }).join('');
}
$('entries').addEventListener('click', async e=>{
  const b=e.target.closest('.del'); if(!b) return;
  if (!confirm('Delete this entry?')) return;
  const { error } = await sb.from('poop_logs').delete().eq('id', b.dataset.id);
  if (error) return toast('Could not delete: '+error.message);
  toast('Entry deleted'); loadEntries();
});
</script>
</body>
